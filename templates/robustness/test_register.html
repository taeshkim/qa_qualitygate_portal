{% extends "base.html" %}

{% block title %}New Reliability Test - Quality Gate Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Reliability Test 등록</h1>
    <a href="{% url 'robustness:test_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" name="name" id="name" class="form-input"
                   placeholder="예: Nightly Reliability Suite"
                   value="{{ request.POST.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">설명 (선택)</label>
            <textarea name="description" id="description" class="form-input" rows="3"
                      placeholder="이 Reliability Test 의 목적을 입력하세요.">{{ request.POST.description }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-check"></i> 등록
            </button>
        </div>
    </form>
</div>
{% endblock %}
