{% extends "base.html" %}

{% block title %}Edit {{ test.name }} - Quality Gate Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Reliability Test 수정</h1>
    <a href="{% url 'robustness:test_detail' test.pk %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" name="name" id="name" class="form-input"
                   value="{{ test.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">설명</label>
            <textarea name="description" id="description" class="form-input" rows="3">{{ test.description }}</textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">저장</button>
        </div>
    </form>
</div>
{% endblock %}
