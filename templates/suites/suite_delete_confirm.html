{% extends "base.html" %}

{% block title %}Delete Suite - Quality Gate Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Suite 삭제</h1>
</div>

<div class="card">
    <p style="margin-bottom:16px">
        <strong>{{ suite.name }}</strong> 스위트를 삭제하시겠습니까?<br>
        <span class="text-muted">하위 Job {{ suite.job_count }}개와 모든 실행 이력이 함께 삭제됩니다.</span>
    </p>
    <form method="post" style="display:flex;gap:8px">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">삭제</button>
        <a href="{% url 'suites:suite_detail' suite.pk %}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
