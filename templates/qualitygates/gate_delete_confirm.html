{% extends "base.html" %}

{% block title %}Delete Gate - Quality Gate Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Quality Gate 삭제</h1>
</div>

<div class="card">
    <p style="margin-bottom:16px">
        <strong>{{ gate.name }}</strong> Quality Gate를 삭제하시겠습니까?<br>
        <span class="text-muted">모든 실행 이력이 함께 삭제됩니다.</span>
    </p>
    <form method="post" style="display:flex;gap:8px">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">삭제</button>
        <a href="{% url 'qualitygates:gate_detail' gate.pk %}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
