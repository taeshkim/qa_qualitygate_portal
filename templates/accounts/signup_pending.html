<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가입 신청 완료 - Quality Gate Portal</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card" style="text-align:center">
            <h1>Quality Gate Portal</h1>
            <div style="margin:24px 0">
                <i class="fas fa-clock" style="font-size:3rem;color:var(--warning)"></i>
            </div>
            <h2 style="margin-bottom:8px;font-size:1.2rem">가입 신청이 완료되었습니다</h2>
            <p style="color:var(--gray-600);line-height:1.7;margin-bottom:24px">
                관리자가 승인한 후 로그인할 수 있습니다.<br>
                승인이 완료되면 기존 ID/비밀번호로 로그인하세요.
            </p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-full">
                로그인 페이지로 돌아가기
            </a>
        </div>
    </div>
</body>
</html>
