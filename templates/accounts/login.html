<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Quality Gate Portal</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Quality Gate Portal</h1>
            <p class="login-subtitle">QG 운영 통합 플랫폼</p>

            {% if form.errors %}
            <div class="alert alert-error">
                아이디 또는 비밀번호가 올바르지 않습니다.<br>
                <span style="font-size:0.85rem">승인 대기 중인 계정은 관리자 승인 후 로그인 가능합니다.</span>
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input" autofocus required>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
            </form>

            <div style="margin-top:16px;text-align:center">
                <a href="{% url 'accounts:signup' %}" style="color:var(--primary);font-size:0.9rem">
                    계정이 없으신가요? 회원가입
                </a>
            </div>
        </div>
    </div>
</body>
</html>
