{% extends "base.html" %}

{% block title %}포털 설정 - Quality Gate Portal{% endblock %}

{% block content %}
<div class="page-header">
    <h1>관리자</h1>
</div>

{% include "accounts/_admin_tabs.html" %}

<form method="post" action="">
    {% csrf_token %}

    <div class="card">
        <h2 class="card-title">
            <i class="fas fa-bars"></i> 좌측 메뉴 표시
        </h2>
        <p class="text-muted" style="margin:-4px 0 16px;font-size:0.88rem">
            끄면 좌측 사이드바에서 해당 메뉴가 숨겨집니다. (URL 직접 접근은 그대로 가능)
        </p>

        <label style="display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 14px;border:1px solid var(--gray-200);border-radius:8px;max-width:420px">
            <input type="checkbox" name="show_quality_gate" style="width:18px;height:18px;cursor:pointer"
                   {% if settings_obj.show_quality_gate %}checked{% endif %}>
            <span style="display:flex;align-items:center;gap:8px">
                <i class="fas fa-shield-alt" style="color:var(--primary)"></i>
                <strong>Quality Gate</strong>
            </span>
            <span class="text-muted" style="margin-left:auto;font-size:0.8rem">메뉴에 표시</span>
        </label>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">저장</button>
    </div>
</form>
{% endblock %}
